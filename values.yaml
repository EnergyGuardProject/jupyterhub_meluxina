imagePullSecrets:
- name: gitlab-regcred

ingress:
  enabled: false

# Idle culling is off: a nohup/background run in a server produces no activity,
# so the culler would stop servers mid-training. Sessions end at the Slurm
# time limit chosen in the spawn form instead.
cull:
  enabled: false

hub:
  # SQLite on the hub-db-dir PVC, so users and running servers survive hub
  # restarts and redeploys.
  db:
    type: sqlite-pvc
  image:
    name: theopnt12/jupyterhub-meluxina
    tag: v4-amd64
  extraEnv:
    COMPUTE_HUB_BASE:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: compute-hub-base
    KEYCLOAK_CLIENT_ID:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: keycloak_client_id
    KEYCLOAK_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: keycloak_client_secret
    KEYCLOAK_REALM:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: keycloak_realm
    KEYCLOAK_BASE_URL:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: keycloak_base_url
    TOKEN_STORE_URL:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: token-store-url
    TOKEN_STORE_API_KEY:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: token-store-api-key
    # Encrypts auth_state at rest; required because we read the user's email
    # from the OAuth auth_state to resolve their per-user Slurm token.
    JUPYTERHUB_CRYPT_KEY:
      valueFrom:
        secretKeyRef:
          name: meluxina-credentials
          key: jupyterhub-crypt-key

  extraConfig:
    01-custom-config: |

      # Keycloak (OIDC) authentication via GenericOAuthenticator.
      from urllib.parse import urlencode
      from oauthenticator.generic import GenericOAuthenticator
      c.JupyterHub.authenticator_class = GenericOAuthenticator

      # Public URL of this Hub. The Keycloak client jupyterhub-meluxina must
      # allow {_public_url}/hub/oauth_callback as a valid redirect URI and
      # {_public_url}/hub/login as a valid post logout redirect URI.
      _public_url = "https://jupyterhub-meluxina.energy-guard.eu"

      _keycloak_realm_url = (
          os.environ["KEYCLOAK_BASE_URL"].rstrip("/")
          + "/realms/" + os.environ["KEYCLOAK_REALM"]
          + "/protocol/openid-connect"
      )
      c.GenericOAuthenticator.client_id = os.environ["KEYCLOAK_CLIENT_ID"]
      c.GenericOAuthenticator.client_secret = os.environ["KEYCLOAK_CLIENT_SECRET"]
      c.GenericOAuthenticator.authorize_url = _keycloak_realm_url + "/auth"
      c.GenericOAuthenticator.token_url = _keycloak_realm_url + "/token"
      c.GenericOAuthenticator.userdata_url = _keycloak_realm_url + "/userinfo"
      c.GenericOAuthenticator.oauth_callback_url = _public_url + "/hub/oauth_callback"
      c.GenericOAuthenticator.login_service = "Keycloak"
      c.GenericOAuthenticator.scope = ["openid", "profile", "email"]
      c.GenericOAuthenticator.username_claim = "preferred_username"
      c.GenericOAuthenticator.allow_all = True

      # Persist the OAuth response (encrypted with JUPYTERHUB_CRYPT_KEY) so the
      # spawner can read the user's email and resolve their per-user Slurm token.
      c.GenericOAuthenticator.enable_auth_state = True
      # Never re-validate against Keycloak after login. Otherwise an expired
      # Keycloak session marks the user's auth as stale and the Hub rejects the
      # running server's API token (activity updates get 403).
      c.GenericOAuthenticator.auth_refresh_age = 0

      # RP-initiated logout: logging out of JupyterHub also ends the Keycloak
      # SSO session, otherwise the next login silently re-authenticates.
      c.GenericOAuthenticator.logout_redirect_url = (
          _keycloak_realm_url + "/logout?" + urlencode({
              "client_id": os.environ["KEYCLOAK_CLIENT_ID"],
              "post_logout_redirect_uri": _public_url + "/hub/login",
          })
      )

      # Per-user Slurm token: after Keycloak login, resolve the user's email and
      # ask the token-store service for their
      # Slurm token, then supply it to the spawn. If the user has no team token
      # (token store returns 404) the pre_spawn_hook raises and JupyterHub shows
      # a "no HPC access" screen instead of starting a server. Re-checked on
      # every spawn so team membership / token rotations take effect immediately.
      import json
      from urllib.parse import quote
      from tornado import web
      from tornado.httpclient import AsyncHTTPClient, HTTPClientError, HTTPRequest

      _NO_HPC = (
          "You are not a member of a team with access to HPC."
      )

      # MeluXina project directories live under this base; a user's working
      # directory is <base>/<project>/jovyan/work (mirrors the convention in
      # the meluxina-credentials secret's working-directory).
      _PROJECT_HOME_BASE = "/project/home"

      def _working_directory_for(project):
          return f"{_PROJECT_HOME_BASE}/{project}/jovyan/work"

      async def resolve_slurm_token(spawner):
          """Return (slurm_token, meluxina_project_name, service_user) for the user.

          Raises web.HTTPError:
          403 -> the user has no team token (no HPC access);
          503 -> the token store itself is unreachable/erroring.
          """
          auth_state = await spawner.user.get_auth_state()
          email = None
          if auth_state:
              email = (auth_state.get("oauth_user") or {}).get("email")
          # Fall back to the Hub username if email is somehow absent.
          username = email or spawner.user.name

          base = os.environ["TOKEN_STORE_URL"].rstrip("/")
          url = base + "/users/" + quote(username, safe="") + "/token"
          req = HTTPRequest(
              url,
              method="GET",
              headers={"X-API-Key": os.environ["TOKEN_STORE_API_KEY"]},
              request_timeout=15,
          )
          try:
              resp = await AsyncHTTPClient().fetch(req)
          except HTTPClientError as e:
              # 400/404 => the service answered: this user has no team token.
              if e.code in (400, 404):
                  spawner.log.warning(
                      "No Slurm token for %s (HTTP %s) - denying HPC access",
                      username, e.code,
                  )
                  raise web.HTTPError(403, _NO_HPC) from e
              # Anything else (5xx, timeout, connection refused) is the token
              # store failing, not a membership decision - say so plainly.
              raise web.HTTPError(
                  503,
                  "The HPC token service is currently unavailable; "
                  "please try again later.",
              ) from e

          body = json.loads(resp.body) or {}
          token = body.get("slurm_token")
          project = body.get("meluxina_project_name")
          service_user = body.get("service_user")
          if not token or not project or not service_user:
              # Defensive: a 200 without a token, project or service user still
              # means no HPC access (the project drives the Slurm account and
              # working dir; the service user authenticates the REST requests).
              raise web.HTTPError(403, _NO_HPC)
          spawner.log.info(
              "Loaded per-user Slurm token, project %s and service user %s for %s",
              project, service_user, username
          )
          return token, project, service_user

      async def fetch_user_slurm_token(spawner):
          # Authoritative gate right before submission (also covers a direct
          # POST that skips the options-form GET). The user's MeluXina project
          # drives the Slurm account and working directory, and the team's
          # service user authenticates the REST requests; all are resolved
          # here and are NOT user-editable in the spawn form.
          token, project, service_user = await resolve_slurm_token(spawner)
          spawner.slurm_token = token
          spawner.account = project
          spawner.slurm_user = service_user
          spawner.current_working_directory = _working_directory_for(project)

      c.SlurmRESTAPISpawner.pre_spawn_hook = fetch_user_slurm_token

      from slurmrestapispawner import SlurmRESTAPISpawner

      class MeluxinaSlurmSpawner(SlurmRESTAPISpawner):
          """SlurmRESTAPISpawner that never mistakes a failed check for a dead job.

          Upstream poll() returns "stopped" on ANY error, and the Hub then calls
          stop(), which scancels the job: one slurmrestd hiccup kills a training
          run. And the Hub DB keeps only job_id, so after a Hub restart the
          token/service user are gone and every check fails the same way.
          """

          async def _ensure_slurm_credentials(self):
              # Rebuilt from the DB after a Hub restart: re-resolve from the
              # token store (the user's email is in the encrypted auth_state).
              if not (self.slurm_token and self.slurm_user):
                  await fetch_user_slurm_token(self)

          async def poll(self):
              if not self.job_id:
                  return 1
              try:
                  await self._ensure_slurm_credentials()
                  job = await self._get_job(self.job_id)
              except Exception:
                  self.log.exception(
                      "Could not check Slurm job %s for %s; assuming it is still running",
                      self.job_id, self.user.name,
                  )
                  return None
              if not job:
                  # 404: Slurm no longer knows the job, it has ended.
                  return 1
              state = self._job_state(job)
              if not state:
                  return None
              match state[0]:
                  case "RUNNING" | "PENDING" | "COMPLETING" | "CONFIGURING" | "SUSPENDED":
                      return None
                  case "COMPLETED":
                      return 0
                  case _:
                      return 1

          async def stop(self, now=False):
              if self.job_id:
                  await self._ensure_slurm_credentials()
              await super().stop(now)

      # Config set on c.SlurmRESTAPISpawner applies to this subclass too.
      c.JupyterHub.spawner_class = MeluxinaSlurmSpawner

      c.SlurmRESTAPISpawner.environment = {
          "COMPUTE_HUB_BASE": os.environ["COMPUTE_HUB_BASE"]
      }
      c.SlurmRESTAPISpawner.slurmrestd_url = "https://slurm.cloud.lxp.lu"
      # slurmrestd at slurm.cloud.lxp.lu dropped v0.0.40 (404); it now serves
      # v0.0.41-v0.0.44. Using the newest available.
      c.SlurmRESTAPISpawner.slurm_api_version = "v0.0.44"
      # No shared/default token: the per-user token from the token store
      # (set in fetch_user_slurm_token) is the ONLY way a spawn gets a token.
      c.SlurmRESTAPISpawner.partition = "gpu"
      # account, slurm_user and current_working_directory are resolved per-user
      # from the token store in fetch_user_slurm_token (pre_spawn_hook), so
      # they are deliberately NOT set (or exposed in the form) here.
      c.SlurmRESTAPISpawner.qos = "default"
      c.SlurmRESTAPISpawner.time_limit = "02:00:00"
      # Generous because the FIRST spawn for a new team builds the eg-default
      # kernel venv inline (see prologue); later spawns skip it via the stamp
      # file. Must stay above the prologue's 1800s concurrent-build wait.
      c.SlurmRESTAPISpawner.start_timeout = 2400
      # Time from the server reporting its port to answering /api. JupyterLab
      # loads from Lustre, which on slow days takes over the 30 s default.
      c.SlurmRESTAPISpawner.http_timeout = 180
      c.SlurmRESTAPISpawner.debug_slurm_api = False
      c.SlurmRESTAPISpawner.debug_show_batch_script = False
      c.SlurmRESTAPISpawner.enable_user_options_form = True

      c.SlurmRESTAPISpawner.prologue = """
      export HOME=$(getent passwd $USER | cut -d: -f6)
      module load Python
      export VENV="$HOME/test_restapi"
      if [[ ! -d $VENV ]]; then
          python3 -m venv $VENV
          source $VENV/bin/activate
          pip install --upgrade pip
          pip install uv
          uv pip install jupyterhub jupyterlab
          uv pip install git+https://github.com/LuxProvide/slurmrestapispawner.git
      fi
      source $VENV/bin/activate

      # ---- EnergyGuard kernel (eg-default) ------------------------------
      # Mirrors Dockerfile.singleuser from epu-ntua/EnergyGuard-JupyterHub,
      # adapted from a container image to a venv on shared storage. Built once
      # per Slurm service user: every member of a team spawns as the same Unix
      # user, so the first spawn for a new team pays the build and every spawn
      # after it is a no-op. energyguard-sdk / MLflow SSO is NOT installed yet.
      #
      # MeluXina module providing PyTorch (built against the cluster's CUDA).
      # From `module spider PyTorch`: newest CUDA build, the -whl variant is
      # the official PyTorch wheel (best pip compatibility). Upstream pins
      # torch==2.10.0; 2.9.1 is the closest available and pytorch_lightning
      # 2.6.1 (targeting 2.10) supports it.
      EG_TORCH_MODULE="PyTorch/2.9.1-foss-2025a-CUDA-12.8.0-whl"

      EG_VERSION=1
      EG_ENV="$HOME/eg-kernel"
      EG_STAMP="$EG_ENV/.eg-complete-v${EG_VERSION}"
      EG_LOCK="$HOME/.eg-kernel-build.lock"

      # Never start a build the job cannot finish. The spawn form lets users
      # pick the wall clock (as low as 10 min), and a build killed halfway
      # wastes their allocation and strands a lock. Require ~30 min headroom.
      EG_MIN_SECONDS=1800
      EG_TIME_OK=1
      if [[ -n "${SLURM_JOB_END_TIME:-}" ]]; then
          (( SLURM_JOB_END_TIME - $(date +%s) < EG_MIN_SECONDS )) && EG_TIME_OK=0
      fi

      if [[ ! -f "$EG_STAMP" && $EG_TIME_OK -eq 0 ]]; then
          echo "EnergyGuard kernel is not built yet and under 30 min of job time remains - skipping the build. Spawn once with a longer time limit to build it." >&2
      elif [[ ! -f "$EG_STAMP" ]]; then
          # A job killed at its Slurm wall-clock limit cannot run its EXIT trap,
          # so the lock can outlive the builder and stall every later spawn.
          # Reclaim one that is clearly stale.
          if [[ -d "$EG_LOCK" ]] && [[ -n "$(find "$EG_LOCK" -maxdepth 0 -mmin +60 2>/dev/null)" ]]; then
              echo "Reclaiming stale EnergyGuard build lock (>60 min old)" >&2
              rmdir "$EG_LOCK" 2>/dev/null
          fi
          # mkdir is atomic on Lustre; flock is not reliably supported there.
          # Bump EG_VERSION to force every team to rebuild on a package change.
          if mkdir "$EG_LOCK" 2>/dev/null; then
              # TERM/INT too: Slurm sends SIGTERM at the wall limit, and a bare
              # EXIT trap does not fire on it.
              trap 'rmdir "$EG_LOCK" 2>/dev/null' EXIT TERM INT
              rm -rf "$EG_ENV"
              # Subshell: these module changes must not disturb the Python that
              # test_restapi - and the running singleuser server - depend on.
              (
                  # set -e is load-bearing: without it a failed `module load`
                  # still falls through and stamps a broken env as complete,
                  # which would never retry.
                  set -e
                  module purge
                  module load "$EG_TORCH_MODULE"
                  python3 -m venv --system-site-packages "$EG_ENV"
                  "$EG_ENV/bin/pip" install --no-cache-dir --upgrade pip
                  # Pin the module's torch so pip can never install a PyPI
                  # torch over it - pytorch_lightning would otherwise drag one
                  # in and shadow the CUDA build we actually want.
                  "$EG_ENV/bin/python" -c 'import torch; print("torch==" + torch.__version__.split("+")[0])' > "$EG_ENV/constraints.txt"
                  "$EG_ENV/bin/pip" install --no-cache-dir -c "$EG_ENV/constraints.txt" \
                      ipykernel \
                      mlflow==3.8.1 \
                      minio==7.2.20 \
                      boto3==1.42.34 \
                      python-dotenv==1.2.1 \
                      pyarrow==22.0.0 \
                      pandas==2.3.3 \
                      matplotlib==3.10.8 \
                      scikit-learn==1.8.0 \
                      tqdm==4.67.1 \
                      requests==2.32.5 \
                      pytorch_lightning==2.6.1
              )
              EG_RC=$?
              if [[ $EG_RC -ne 0 ]]; then
                  # Leave NO stamp and remove the partial venv, so the next
                  # spawn retries instead of serving a half-built kernel
                  # forever. The spawn itself continues regardless - a broken
                  # kernel must not cost the user their server.
                  echo "EnergyGuard kernel build FAILED (rc=$EG_RC) for $EG_TORCH_MODULE - no stamp written, next spawn will retry" >&2
                  rm -rf "$EG_ENV"
              else
              # The kernel is launched by the server, which does NOT have the
              # PyTorch module loaded, so the kernel re-loads it itself instead
              # of relying on inherited environment.
              printf '%s\n' '#!/bin/bash' 'module purge' "module load $EG_TORCH_MODULE" "source $EG_ENV/bin/activate" 'exec python -m ipykernel_launcher "$@"' > "$EG_ENV/bin/eg-kernel-launch"
              chmod +x "$EG_ENV/bin/eg-kernel-launch"
              # Kernelspec lives in the SERVER's venv so JupyterLab discovers it
              # under {sys.prefix}/share/jupyter/kernels, while the kernel
              # process itself runs out of eg-kernel.
              mkdir -p "$VENV/share/jupyter/kernels/eg-default"
              printf '{"argv": ["%s/bin/eg-kernel-launch", "-f", "{connection_file}"], "display_name": "EnergyGuard (Python)", "language": "python"}\n' "$EG_ENV" > "$VENV/share/jupyter/kernels/eg-default/kernel.json"
              # Same role as upstream's /etc/jupyter/jupyter_server_config.py;
              # Jupyter reads {sys.prefix}/etc/jupyter.
              mkdir -p "$VENV/etc/jupyter"
              printf "c.MappingKernelManager.default_kernel_name = 'eg-default'\n" > "$VENV/etc/jupyter/jupyter_server_config.py"
              touch "$EG_STAMP"
              fi
              rmdir "$EG_LOCK" 2>/dev/null
              trap - EXIT
          else
              # A concurrent spawn is building it. Wait briefly, then give up
              # and start the server anyway - the kernel will be there next
              # time. Never burn the user's whole wall-clock allocation
              # waiting on someone else's build.
              echo "EnergyGuard kernel build in progress elsewhere - waiting up to 5 min" >&2
              for _ in $(seq 1 30); do
                  [[ -f "$EG_STAMP" ]] && break
                  sleep 10
              done
              [[ -f "$EG_STAMP" ]] || echo "Kernel not ready yet; starting server without it" >&2
          fi
      fi
      # ---- end EnergyGuard kernel ---------------------------------------

      # Trust the public CAs AND the mkcert CA that signs the Hub's cert, so
      # code in the server/kernels can still reach normal HTTPS sites.
      cat /etc/pki/tls/certs/ca-bundle.crt "$HOME/certs/mkcert-ca.crt" > "$HOME/certs/ca-bundle-with-mkcert.crt"
      export REQUESTS_CA_BUNDLE="$HOME/certs/ca-bundle-with-mkcert.crt"
      export SSL_CERT_FILE="${REQUESTS_CA_BUNDLE}"
      export CURL_CA_BUNDLE="${REQUESTS_CA_BUNDLE}"
      export JUPYTERHUB_API_URL="${COMPUTE_HUB_BASE}/hub/api"
      export JUPYTERHUB_ACTIVITY_URL="${JUPYTERHUB_API_URL}/users/${JUPYTERHUB_USER}/activity"
      env | grep JUPYTER | sed 's/TOKEN=.*/TOKEN=***/'"""
      #